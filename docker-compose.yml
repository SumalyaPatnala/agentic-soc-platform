# Local Apache Kafka in KRaft mode. Cost: $0. No ZooKeeper. No cloud.
#
# Python on the Mac:  localhost:9092
# Other Compose services: kafka:19092
#
# Controller listener stays inside the container network (29093, unpublished).

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: soc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 25s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: soc-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        bootstrap="kafka:19092"
        for topic in soc.raw.events soc.normalized.events soc.evidence.events soc.deadletter; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$$bootstrap" \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done
        echo "topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$bootstrap" --list

volumes:
  kafka-data:
